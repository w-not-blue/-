# ============================================================================
# 仿真模拟测试环境配置文件
# 用于系统性验证系统在不同场景下的适配性、稳定性及安全性
# ============================================================================

environment:
  name: "仿真模拟测试环境"
  version: "1.0.0"
  reset_on_startup: true
  snapshot_interval: 60

# ---------------------------------------------------------------------------
# 一、网络拓扑模拟
# ---------------------------------------------------------------------------
network:
  topology: "spine_leaf"
  regions:
    - name: "廊坊核心区"
      latency_ms: 0.5
      bandwidth_mbps: 10000
      packet_loss: 0.0001
      jitter_ms: 0.1
    - name: "北京边缘区"
      latency_ms: 5.0
      bandwidth_mbps: 1000
      packet_loss: 0.001
      jitter_ms: 1.0
    - name: "天津备份区"
      latency_ms: 10.0
      bandwidth_mbps: 500
      packet_loss: 0.005
      jitter_ms: 2.0
    - name: "雄安新区"
      latency_ms: 20.0
      bandwidth_mbps: 200
      packet_loss: 0.01
      jitter_ms: 5.0

# ---------------------------------------------------------------------------
# 二、硬件配置模拟
# ---------------------------------------------------------------------------
hardware_profiles:
  - name: "鲲鹏920开发板"
    type: "arm64"
    cpu_cores: 64
    memory_gb: 256
    disk_gb: 1000
    nic_speed_mbps: 10000
    gpu: null
    npu: "Ascend310"
    os: "openEuler 22.03"
    proportion: 0.4

  - name: "标准x86服务器"
    type: "x86_64"
    cpu_cores: 32
    memory_gb: 128
    disk_gb: 2000
    nic_speed_mbps: 10000
    gpu: "NVIDIA A100"
    npu: null
    os: "CentOS 7.9"
    proportion: 0.35

  - name: "高性能GPU节点"
    type: "x86_64"
    cpu_cores: 48
    memory_gb: 512
    disk_gb: 4000
    nic_speed_mbps: 25000
    gpu: "NVIDIA H100 x4"
    npu: null
    os: "Ubuntu 22.04"
    proportion: 0.2

  - name: "边缘计算节点"
    type: "arm64"
    cpu_cores: 8
    memory_gb: 32
    disk_gb: 256
    nic_speed_mbps: 1000
    gpu: null
    npu: null
    os: "openEuler 22.03"
    proportion: 0.05

# ---------------------------------------------------------------------------
# 三、软件依赖矩阵
# ---------------------------------------------------------------------------
software_matrix:
  python_versions: ["3.9", "3.10", "3.11", "3.12"]
  os_list: ["openEuler 22.03", "CentOS 7.9", "Ubuntu 22.04", "Windows Server 2022"]
  
  dependencies:
    numpy: ["1.24.0", "1.25.0", "1.26.0"]
    pandas: ["2.0.0", "2.1.0", "2.2.0"]
    flask: ["2.3.0", "3.0.0"]
    torch: ["2.0.0", "2.1.0", "2.2.0"]
  
  conflicting_packages:
    - ["torch>=2.0.0", "torch_npu<2.0.0"]
    - ["grpcio>=1.57.0", "protobuf<3.20.0"]

# ---------------------------------------------------------------------------
# 四、数据流量特征模拟
# ---------------------------------------------------------------------------
traffic_patterns:
  - name: "正常负载"
    requests_per_sec: 100
    data_size_kb: 5
    concurrency: 10
    duration_minutes: 30

  - name: "潮汐峰值"
    requests_per_sec: 500
    data_size_kb: 20
    concurrency: 50
    duration_minutes: 15

  - name: "突发流量"
    requests_per_sec: 2000
    data_size_kb: 2
    concurrency: 200
    duration_minutes: 5

  - name: "持续高压"
    requests_per_sec: 800
    data_size_kb: 10
    concurrency: 100
    duration_minutes: 60

  - name: "DDoS模拟"
    requests_per_sec: 50000
    data_size_kb: 1
    concurrency: 5000
    duration_minutes: 2

# ---------------------------------------------------------------------------
# 五、兼容性测试矩阵
# ---------------------------------------------------------------------------
compatibility:
  cross_version_tests:
    - name: "Python版本兼容"
      dimensions: ["3.9", "3.10", "3.11", "3.12"]
      test_count: 20
    - name: "OS兼容性"
      dimensions: ["openEuler", "CentOS", "Ubuntu", "Windows"]
      test_count: 16
    - name: "依赖版本兼容"
      dimensions: ["最低版本", "推荐版本", "最新版本"]
      test_count: 30
  
  cross_platform_tests:
    - name: "x86_64 vs ARM64"
      dimensions: ["x86_64", "arm64"]
      test_count: 10

# ---------------------------------------------------------------------------
# 六、压力测试阈值
# ---------------------------------------------------------------------------
stress_thresholds:
  cpu:
    warning: 70
    critical: 85
    max: 95
  memory:
    warning: 75
    critical: 90
    max: 95
  disk_io:
    warning_mbps: 500
    critical_mbps: 800
  network:
    warning_mbps: 8000
    critical_mbps: 9500
  response_time:
    warning_ms: 200
    critical_ms: 500
    timeout_ms: 5000
  error_rate:
    warning: 0.01
    critical: 0.05
    max: 0.10

# ---------------------------------------------------------------------------
# 七、安全扫描配置
# ---------------------------------------------------------------------------
security:
  scan_frequency: "per_test_run"
  vulnerability_db: "nvd"
  scan_types:
    - "dependency_check"
    - "port_scan"
    - "code_sast"
    - "api_fuzzing"
    - "injection_test"
    - "auth_bypass"
  
  owasp_top10: true
  cvss_threshold: 7.0
  
  allowed_ports: [5000, 8000, 8080, 9090]
  blocked_ports: [22, 3306, 5432, 6379, 27017]
  
  injection_payloads:
    sql: ["' OR '1'='1", "1; DROP TABLE users", "' UNION SELECT * FROM users"]
    xss: ["<script>alert(1)</script>", "javascript:alert(1)", "<img onerror=alert(1) src=x>"]
    command: ["; ls -la", "| cat /etc/passwd", "$(whoami)"]

# ---------------------------------------------------------------------------
# 八、环境重置配置
# ---------------------------------------------------------------------------
reset:
  strategy: "snapshot"
  snapshot_dir: "test_snapshots"
  max_snapshots: 10
  auto_cleanup: true
  restore_timeout_sec: 30

# ---------------------------------------------------------------------------
# 九、测试报告配置
# ---------------------------------------------------------------------------
reporting:
  output_dir: "test_reports"
  formats: ["json", "html", "pdf", "junit_xml"]
  retention_days: 30
  include_trends: true
  slack_webhook: null
