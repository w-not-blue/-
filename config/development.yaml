simulation:
  num_servers: 48
  simulation_hours: 24
  parallel_workers: 2
  enable_distributed: false
  run_mode: "standard"

environment:
  ambient_temp_base: 25

cooling:
  target_temp: 22

genetic:
  population_size: 30
  generations: 50
  enable_parallel: false
  parallel_evaluators: 1

output:
  enable_visualization: true
  enable_statistics: true
  enable_detailed_logging: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
damo_ets:
  alpha_deadline: 0.5
  beta_energy: 0.2
  gamma_thermal: 0.15
  delta_heterogeneity: 0.1
  epsilon_migration: 0.05