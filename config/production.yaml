simulation:
  num_servers: 100
  simulation_hours: 168
  parallel_workers: 8
  enable_distributed: false
  distributed_workers: 8
  run_mode: "standard"

environment:
  ambient_temp_base: 22

cooling:
  target_temp: 20
  fan_speed_range: [0.3, 1.0]

genetic:
  population_size: 100
  generations: 200
  enable_parallel: true
  parallel_evaluators: 8

task_generation:
  base_rate: 12
  peak_rate: 40

output:
  enable_visualization: true
  enable_statistics: true
  enable_detailed_logging: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
