<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 校园数据中心智能散热与算力调度系统</title>
    <meta name="theme-color" content="#0f0f15">
    <meta name="color-scheme" content="light">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192x192.png?v=20261020-ai91">
    <link href="/bootstrap.min.css" rel="stylesheet">
    <link href="/font-awesome.min.css" rel="stylesheet">
    <link href="/theme.css?v=20261020-ui3" rel="stylesheet">
    <link href="/auth.css?v=20261020-ui3" rel="stylesheet">
</head>
<body class="auth-body">
    <main class="auth-shell">
        <section class="auth-form-panel">
            <div class="auth-card">
                <div class="auth-compact-brand">
                    <img src="/logo.png?v=20261020-ai91" alt="校园数据中心智能散热与算力调度系统">
                    <span>校园数据中心智能散热与<br>算力调度系统</span>
                </div>

                <div class="auth-eyebrow">GET STARTED</div>
                <h2>创建账号</h2>
                <p class="auth-sub">填写信息后即可登录控制台</p>

                <div id="authError" class="auth-alert auth-alert-error" hidden></div>

                <form id="registerForm" novalidate>
                    <div class="auth-field">
                        <label for="username">用户名</label>
                        <div class="auth-input-wrap">
                            <i class="fas fa-user"></i>
                            <input type="text" id="username" name="username" placeholder="3-32 位字母、数字或中文" autocomplete="username" maxlength="32" autofocus>
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="password">密码</label>
                        <div class="auth-input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="至少 6 位密码" autocomplete="new-password" maxlength="64">
                            <button type="button" class="password-toggle" data-toggle-password="password" title="显示或隐藏密码" aria-label="显示或隐藏密码">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="confirmPassword">确认密码</label>
                        <div class="auth-input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirmPassword" name="confirm_password" placeholder="请再次输入密码" autocomplete="new-password" maxlength="64">
                            <button type="button" class="password-toggle" data-toggle-password="confirmPassword" title="显示或隐藏密码" aria-label="显示或隐藏密码">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="auth-note">用户名 3-32 位字母、数字、下划线或中文；密码 6-64 位。</div>

                    <button type="submit" class="auth-submit" id="registerSubmit">
                        <span id="registerSubmitLabel">创建账号</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <p class="auth-switch">已有账号？<a href="/login.html">返回登录</a></p>
                </form>

                <div class="auth-foot">
                    <span>v1.0.0</span>
                    <span>校园数据中心智能散热与算力调度系统</span>
                </div>
            </div>
        </section>
    </main>

    <script src="/auth.js?v=20261020-ai91"></script>
</body>
</html>
