<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 校园数据中心智能散热与算力调度系统</title>
    <meta name="theme-color" content="#0f0f15">
    <meta name="color-scheme" content="light">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192x192.png?v=20261020-ai91">
    <link href="/bootstrap.min.css" rel="stylesheet">
    <link href="/font-awesome.min.css" rel="stylesheet">
    <link href="/theme.css?v=20261020-ui3" rel="stylesheet">
    <link href="/auth.css?v=20261020-ui3" rel="stylesheet">
</head>
<body class="auth-body">
    <main class="auth-shell">
        <section class="auth-form-panel">
            <div class="auth-card">
                <div class="auth-compact-brand">
                    <img src="/logo.png?v=20261020-ai91" alt="校园数据中心智能散热与算力调度系统">
                    <span>校园数据中心智能散热与<br>算力调度系统</span>
                </div>

                <div class="auth-eyebrow">WELCOME BACK</div>
                <h2>登录控制台</h2>
                <p class="auth-sub">使用账号进入校园算力调度平台</p>

                <div id="authSuccess" class="auth-alert auth-alert-success" hidden></div>
                <div id="authError" class="auth-alert auth-alert-error" hidden></div>

                <form id="loginForm" novalidate>
                    <div class="auth-field">
                        <label for="username">账号</label>
                        <div class="auth-input-wrap">
                            <i class="fas fa-user"></i>
                            <input type="text" id="username" name="username" placeholder="请输入账号" autocomplete="username" maxlength="32" autofocus>
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="password">密码</label>
                        <div class="auth-input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" maxlength="64">
                            <button type="button" class="password-toggle" data-toggle-password="password" title="显示或隐藏密码" aria-label="显示或隐藏密码">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="captcha">图形验证码</label>
                        <div class="captcha-row">
                            <div class="auth-input-wrap">
                                <i class="fas fa-shield-alt"></i>
                                <input type="text" id="captcha" name="captcha" placeholder="请输入 4 位验证码" autocomplete="off" maxlength="4">
                            </div>
                            <button type="button" class="captcha-image-btn" id="captchaRefresh" title="点击刷新验证码" aria-label="点击刷新验证码">
                                <img id="captchaImage" alt="图形验证码">
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="auth-submit" id="loginSubmit">
                        <span id="loginSubmitLabel">登录</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <p class="auth-switch">还没有账号？<a href="/register.html">立即注册</a></p>
                </form>

                <div class="auth-foot">
                    <span>v1.0.0</span>
                    <span>校园数据中心智能散热与算力调度系统</span>
                </div>
            </div>
        </section>
    </main>

    <script src="/auth.js?v=20261020-ai91"></script>
</body>
</html>
